services:
  postgres:
    image: postgres:16-alpine
    container_name: motorcycle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: motorcycle_parts_db
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - motorcycle-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motorcycle_parts_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: motorcycle-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      TZ: Asia/Bangkok
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - motorcycle-net

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  motorcycle-net:
    driver: bridge
